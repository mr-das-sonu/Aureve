<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf8f2">
  <meta name="description" content="AUREVÉ — independent Swiss watchmaking, guided by the quiet pursuit of permanence. Discover considered mechanical timepieces, made in Le Locle.">
  <meta property="og:title" content="AUREVÉ — Time, considered">
  <meta property="og:description" content="Time is not measured. It is crafted. Discover the world of AUREVÉ Swiss watchmaking.">
  <meta property="og:type" content="website">
  <title>AUREVÉ — Time, considered</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ivory: #faf8f2;
      --paper: #f3efe6;
      --beige: #c7bba8;
      --green: #53665a;
      --green-dark: #384b40;
      --charcoal: #22231f;
      --white: #fff;
      --gold: #a58a5a;
      --line: rgba(34, 35, 31, .16);
      --serif: "Cormorant Garamond", Georgia, serif;
      --sans: "DM Sans", Arial, sans-serif;
      --gutter: clamp(22px, 5.2vw, 82px);
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 84px; }
    body {
      margin: 0;
      background: var(--ivory);
      color: var(--charcoal);
      font-family: var(--sans);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }
    body.menu-open { overflow: hidden; }
    img { display: block; width: 100%; }
    a { color: inherit; text-decoration: none; }
    button, input, textarea, select { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }
    ::selection { color: var(--ivory); background: var(--green); }

    .skip-link {
      position: fixed; top: 10px; left: 10px; z-index: 100;
      padding: 12px 16px; background: var(--charcoal); color: var(--white);
      transform: translateY(-150%);
    }
    .skip-link:focus { transform: none; }
    .eyebrow {
      margin: 0 0 18px; color: var(--green); font-size: 10px;
      font-weight: 600; letter-spacing: .2em; line-height: 1.5;
      text-transform: uppercase;
    }
    .serif { font-family: var(--serif); font-weight: 400; }
    .display {
      margin: 0; font-family: var(--serif); font-size: clamp(54px, 8vw, 112px);
      font-weight: 400; letter-spacing: -.055em; line-height: .87;
    }
    .body-copy {
      max-width: 430px; color: rgba(34, 35, 31, .68);
      font-size: 13px; line-height: 1.9;
    }
    .section-pad { padding: clamp(80px, 11vw, 160px) var(--gutter); }
    .section-head {
      display: flex; align-items: end; justify-content: space-between;
      gap: 30px; margin-bottom: clamp(36px, 5vw, 70px);
    }
    .section-head h2 {
      margin: 0; font: 400 clamp(42px, 5.5vw, 76px)/.95 var(--serif);
      letter-spacing: -.045em;
    }
    .section-head .body-copy { margin: 0 0 4px; max-width: 310px; }
    .text-link {
      display: inline-flex; align-items: center; gap: 14px;
      width: fit-content; padding: 0 0 8px; border-bottom: 1px solid currentColor;
      color: var(--charcoal); font-size: 10px; font-weight: 600;
      letter-spacing: .15em; text-transform: uppercase;
      transition: color .25s ease, gap .35s var(--ease);
    }
    .text-link:hover { gap: 21px; color: var(--green); }
    .text-link svg { width: 16px; height: 12px; }
    .button {
      display: inline-flex; min-height: 48px; align-items: center; justify-content: center;
      gap: 20px; padding: 0 21px; border: 1px solid var(--charcoal);
      background: var(--charcoal); color: var(--ivory); cursor: pointer;
      font-size: 9px; font-weight: 600; letter-spacing: .16em;
      text-transform: uppercase; transition: background .3s ease, color .3s ease, border-color .3s ease;
    }
    .button:hover { border-color: var(--green); background: var(--green); }
    .button--light { border-color: rgba(250,248,242,.7); background: transparent; color: var(--ivory); }
    .button--light:hover { border-color: var(--ivory); background: var(--ivory); color: var(--charcoal); }
    .button svg { width: 15px; height: 12px; transition: transform .3s var(--ease); }
    .button:hover svg { transform: translateX(4px); }

    .site-header {
      position: absolute; z-index: 20; top: 0; left: 0; display: flex;
      width: 100%; height: 88px; align-items: center; justify-content: space-between;
      padding: 0 var(--gutter); color: var(--ivory);
      transition: color .3s ease, background .3s ease, height .3s ease;
    }
    .site-header.is-solid {
      position: sticky; height: 72px; border-bottom: 1px solid var(--line);
      background: rgba(250,248,242,.96); color: var(--charcoal);
      backdrop-filter: blur(14px);
    }
    .brand {
      position: relative; z-index: 22; display: inline-flex; align-items: center;
      gap: 10px; font: 500 24px/1 var(--serif); letter-spacing: .16em;
    }
    .brand-mark {
      width: 22px; height: 22px; color: var(--gold);
    }
    .header-nav { display: flex; align-items: center; gap: clamp(22px, 3.2vw, 50px); }
    .header-nav a:focus-visible, .brand:focus-visible, .header-inquiry:focus-visible,
    .menu-toggle:focus-visible, .text-link:focus-visible, .button:focus-visible {
      outline: 2px solid var(--gold); outline-offset: 4px;
    }
    .header-nav a {
      position: relative; padding: 8px 0; font-size: 9px; font-weight: 500;
      letter-spacing: .16em; text-transform: uppercase; opacity: .8;
      transition: opacity .2s ease;
    }
    .header-nav a:hover, .header-nav a[aria-current="page"] { opacity: 1; }
    .header-nav a::after {
      position: absolute; right: 0; bottom: 3px; left: 0; height: 1px;
      background: currentColor; content: ""; transform: scaleX(0);
      transform-origin: right; transition: transform .35s var(--ease);
    }
    .header-nav a:hover::after, .header-nav a[aria-current="page"]::after {
      transform: scaleX(1); transform-origin: left;
    }
    .header-actions { display: flex; align-items: center; gap: 17px; }
    .header-inquiry {
      padding: 12px 16px; border: 1px solid rgba(250,248,242,.5);
      font-size: 9px; letter-spacing: .13em; text-transform: uppercase;
      transition: background .25s ease, color .25s ease, border-color .25s ease;
    }
    .is-solid .header-inquiry { border-color: var(--line); }
    .header-inquiry:hover { border-color: var(--ivory); background: var(--ivory); color: var(--charcoal); }
    .is-solid .header-inquiry:hover { border-color: var(--green); background: var(--green); color: var(--ivory); }
    .menu-toggle {
      display: none; width: 44px; height: 44px; padding: 12px 9px; border: 0;
      border-radius: 50%; background: transparent; cursor: pointer;
      transition: background-color .25s ease, color .25s ease;
    }
    .menu-toggle:active, .menu-toggle[aria-expanded="true"] { background: var(--white); color: var(--charcoal); }
    .menu-toggle span {
      display: block; height: 1px; margin: 5px 0; background: currentColor;
      transition: transform .3s ease, width .3s ease;
    }
    .menu-toggle span:last-child { width: 70%; margin-left: auto; }
    .menu-toggle[aria-expanded="true"] span:first-child { transform: translateY(3px) rotate(45deg); }
    .menu-toggle[aria-expanded="true"] span:last-child { width: 100%; transform: translateY(-3px) rotate(-45deg); }

    main { min-height: 55vh; transition: opacity .28s ease, transform .28s ease; }
    main.is-leaving { opacity: 0; transform: translateY(8px); }
    .hero {
      position: relative; display: flex; min-height: min(790px, 100svh);
      min-height: max(660px, 100svh); align-items: end; overflow: hidden;
      background: #37352e; color: var(--ivory);
    }
    .hero::after {
      position: absolute; inset: 0; background: linear-gradient(90deg, rgba(20,21,19,.58) 0%, rgba(20,21,19,.2) 53%, rgba(20,21,19,.04) 100%), linear-gradient(0deg, rgba(20,21,19,.45), transparent 40%);
      content: "";
    }
    .hero-image { position: absolute; inset: 0; height: 100%; object-fit: cover; object-position: center 54%; }
    .hero-content {
      position: relative; z-index: 1; display: grid; width: 100%;
      grid-template-columns: minmax(0, 1fr) minmax(190px, 260px);
      align-items: end; gap: 38px; padding: 0 var(--gutter) clamp(58px, 8vw, 115px);
    }
    .hero .eyebrow { color: #d3c7b1; }
    .hero h1 {
      max-width: 780px; margin: 0; font: 400 clamp(66px, 10.2vw, 148px)/.78 var(--serif);
      letter-spacing: -.055em; text-transform: uppercase;
    }
    .hero h1 span { display: block; }
    .hero h1 span:last-child { margin-left: clamp(35px, 9vw, 140px); }
    .hero-aside { padding-bottom: 7px; }
    .hero-aside p { margin: 0 0 26px; color: rgba(250,248,242,.78); font-size: 12px; line-height: 1.85; }
    .hero-index {
      position: absolute; z-index: 2; right: var(--gutter); top: 50%;
      color: rgba(250,248,242,.8); font-size: 9px; letter-spacing: .18em;
      writing-mode: vertical-rl;
    }
    .hero-bottom {
      position: absolute; z-index: 2; right: var(--gutter); bottom: 24px; left: var(--gutter);
      display: flex; align-items: center; justify-content: space-between;
      color: rgba(250,248,242,.72); font-size: 8px; letter-spacing: .16em; text-transform: uppercase;
    }
    .hero-bottom span:last-child { display: flex; align-items: center; gap: 12px; }
    .hero-bottom svg { width: 14px; height: 20px; }
    .intro {
      display: grid; grid-template-columns: .75fr 1.25fr; gap: 7vw;
      align-items: start; padding: clamp(88px, 13vw, 190px) var(--gutter);
    }
    .intro-side { padding-top: 9px; }
    .intro h2 {
      max-width: 860px; margin: 0; font: 400 clamp(42px, 6.3vw, 90px)/.98 var(--serif);
      letter-spacing: -.05em;
    }
    .intro h2 em { color: var(--green); font-weight: 400; }
    .intro-side .body-copy { margin: 24px 0 0; }
    .collection-section { padding: 0 var(--gutter) clamp(96px, 13vw, 180px); }
    .product-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    .product-card { min-width: 0; }
    .product-card:nth-child(2) { margin-top: 62px; }
    .product-card:nth-child(3) { margin-top: 124px; }
    .product-image {
      position: relative; overflow: hidden; aspect-ratio: .79;
      background: var(--paper);
    }
    .product-image img {
      height: 100%; object-fit: cover; transition: transform .8s var(--ease);
    }
    .product-card:hover .product-image img { transform: scale(1.045); }
    .product-image::after {
      position: absolute; inset: 0; border: 1px solid rgba(34,35,31,.04);
      content: ""; pointer-events: none;
    }
    .product-image-label {
      position: absolute; top: 17px; left: 17px; z-index: 1; padding: 8px 10px;
      background: rgba(250,248,242,.88); color: var(--green);
      font-size: 8px; letter-spacing: .15em; text-transform: uppercase;
    }
    .product-meta { display: flex; justify-content: space-between; gap: 16px; padding: 17px 0 0; }
    .product-meta p { margin: 0; }
    .product-category { margin-bottom: 7px !important; color: var(--green); font-size: 8px; letter-spacing: .16em; text-transform: uppercase; }
    .product-name { font: 500 25px/1 var(--serif); }
    .product-price { padding-top: 22px; color: rgba(34,35,31,.72); font-size: 10px; letter-spacing: .04em; }
    .product-card-link { display: block; }
    .philosophy {
      position: relative; overflow: hidden; padding: clamp(115px, 16vw, 225px) var(--gutter);
      background: var(--green); color: var(--ivory); text-align: center;
    }
    .philosophy::before, .philosophy::after {
      position: absolute; top: 50%; width: 16vw; height: 1px; background: rgba(250,248,242,.28); content: "";
    }
    .philosophy::before { left: 0; } .philosophy::after { right: 0; }
    .philosophy .eyebrow { color: #d2c7b4; }
    .philosophy blockquote {
      max-width: 990px; margin: 0 auto; font: 400 clamp(45px, 7.3vw, 104px)/.94 var(--serif);
      letter-spacing: -.04em;
    }
    .philosophy blockquote em { color: #d1c5ae; font-weight: 400; }
    .philosophy .text-link { margin: 37px auto 0; color: var(--ivory); }
    .split-story {
      display: grid; min-height: 660px; grid-template-columns: 1fr 1fr;
      background: var(--paper);
    }
    .split-story-image { min-height: 520px; overflow: hidden; }
    .split-story-image img { height: 100%; min-height: 520px; object-fit: cover; }
    .split-story-copy { display: flex; flex-direction: column; justify-content: center; padding: clamp(46px, 9vw, 130px); }
    .split-story-copy h2 { max-width: 550px; margin: 0 0 24px; font: 400 clamp(44px, 5.6vw, 78px)/.91 var(--serif); letter-spacing: -.05em; }
    .split-story-copy .body-copy { margin: 0 0 28px; }
    .craft-strip {
      display: grid; grid-template-columns: 1.3fr .7fr; align-items: center; gap: clamp(36px, 8vw, 120px);
      padding: clamp(90px, 12vw, 168px) var(--gutter);
    }
    .craft-strip-image { position: relative; overflow: hidden; aspect-ratio: 1.18; background: var(--paper); }
    .craft-strip-image img { height: 100%; object-fit: cover; }
    .craft-strip-copy h2 { margin: 0 0 22px; font: 400 clamp(44px, 5vw, 70px)/.93 var(--serif); letter-spacing: -.045em; }
    .craft-strip-copy .body-copy { margin: 0 0 30px; }
    .heritage-note {
      position: relative; min-height: 500px; display: grid; place-items: center;
      overflow: hidden; padding: 80px var(--gutter); background: var(--charcoal); color: var(--ivory); text-align: center;
    }
    .heritage-note img { position: absolute; inset: 0; height: 100%; object-fit: cover; opacity: .31; }
    .heritage-note::after { position: absolute; inset: 0; background: rgba(25,26,23,.32); content: ""; }
    .heritage-note-inner { position: relative; z-index: 1; }
    .heritage-note h2 { max-width: 800px; margin: 0 auto 30px; font: 400 clamp(48px, 7vw, 98px)/.9 var(--serif); letter-spacing: -.05em; }
    .heritage-note .eyebrow { color: #d5c7ad; }
    .heritage-note .text-link { color: var(--ivory); margin: 0 auto; }

    .page-hero {
      position: relative; display: flex; min-height: min(720px, 90svh);
      align-items: end; overflow: hidden; background: #34352f; color: var(--ivory);
    }
    .page-hero img { position: absolute; inset: 0; height: 100%; object-fit: cover; }
    .page-hero::after { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(20,21,19,.64), rgba(20,21,19,.06) 80%); content: ""; }
    .page-hero-content { position: relative; z-index: 1; width: 100%; padding: 0 var(--gutter) clamp(58px, 8vw, 110px); }
    .page-hero-content h1 { max-width: 900px; margin: 0; font: 400 clamp(62px, 10vw, 132px)/.82 var(--serif); letter-spacing: -.055em; }
    .page-hero-content p:not(.eyebrow) { max-width: 460px; margin: 25px 0 0; color: rgba(250,248,242,.78); font-size: 12px; line-height: 1.8; }
    .collection-intro { display: flex; justify-content: space-between; gap: 35px; align-items: end; padding: 90px var(--gutter) 50px; }
    .collection-intro h2 { max-width: 720px; margin: 0; font: 400 clamp(42px, 6.4vw, 88px)/.92 var(--serif); letter-spacing: -.05em; }
    .collection-intro .body-copy { margin: 0 0 4px; }
    .collection-page-grid { padding: 0 var(--gutter) 120px; }
    .collection-page-grid .product-grid { row-gap: 70px; }
    .collection-page-grid .product-card:nth-child(2), .collection-page-grid .product-card:nth-child(3) { margin-top: 0; }
    .collection-page-grid .product-card:nth-child(3n + 2) { margin-top: 60px; }

    .detail-top {
      display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(350px, .9fr);
      gap: clamp(40px, 7vw, 110px); padding: 125px var(--gutter) 90px;
    }
    .gallery-main { position: relative; overflow: hidden; aspect-ratio: .95; background: var(--paper); }
    .gallery-main img { height: 100%; object-fit: cover; transition: opacity .25s ease; }
    .gallery-thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
    .gallery-thumb {
      padding: 0; overflow: hidden; border: 1px solid transparent; background: var(--paper);
      cursor: pointer; aspect-ratio: 1.2;
    }
    .gallery-thumb[aria-pressed="true"] { border-color: var(--green); }
    .gallery-thumb img { height: 100%; object-fit: cover; transition: transform .45s var(--ease); }
    .gallery-thumb:hover img { transform: scale(1.05); }
    .detail-copy { align-self: center; }
    .detail-code { margin: 0 0 18px; color: var(--green); font-size: 9px; letter-spacing: .2em; text-transform: uppercase; }
    .detail-copy h1 { margin: 0; font: 400 clamp(50px, 6.4vw, 88px)/.9 var(--serif); letter-spacing: -.05em; }
    .detail-subtitle { margin: 14px 0 22px; color: rgba(34,35,31,.66); font: 400 22px/1.2 var(--serif); }
    .detail-copy .body-copy { margin: 0; }
    .detail-price { margin: 30px 0 24px; font-size: 12px; letter-spacing: .1em; }
    .detail-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 22px; }
    .detail-actions .text-link { font-size: 9px; }
    .detail-specs { padding: 76px var(--gutter) 100px; background: var(--paper); }
    .detail-specs h2 { margin: 0 0 38px; font: 400 clamp(42px, 5vw, 68px)/1 var(--serif); letter-spacing: -.04em; }
    .spec-grid { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); }
    .spec-item { padding: 21px 20px 21px 0; border-bottom: 1px solid var(--line); }
    .spec-item span { display: block; margin-bottom: 10px; color: var(--green); font-size: 8px; letter-spacing: .16em; text-transform: uppercase; }
    .spec-item strong { font: 400 21px/1.3 var(--serif); }
    .related-section { padding: 100px var(--gutter); }
    .story-watch-section { padding: clamp(40px, 7vw, 96px) var(--gutter); background: var(--beige); }
    .story-watch-card { max-width: 1440px; margin: 0 auto; padding: clamp(22px, 3.2vw, 46px); background: var(--ivory); }
    .story-watch-main { display: grid; grid-template-columns: 1.08fr .92fr; align-items: center; gap: clamp(32px, 6vw, 86px); }
    .story-watch-image { position: relative; overflow: hidden; aspect-ratio: 1.12; background: var(--paper); }
    .story-watch-image img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s var(--ease); }
    .story-watch-image:hover img { transform: scale(1.035); }
    .story-watch-image svg { display: block; width: 100%; height: 100%; }
    .story-watch-image span { position: absolute; right: 18px; bottom: 18px; color: var(--ivory); font-size: 8px; letter-spacing: .17em; text-transform: uppercase; text-shadow: 0 1px 10px rgba(0,0,0,.4); }
    .story-watch-copy { max-width: 460px; padding: 30px 0; }
    .story-watch-copy h2 { margin: 0; font: 400 clamp(46px, 6.2vw, 82px)/.87 var(--serif); letter-spacing: -.055em; }
    .story-watch-code { margin: 0 0 17px; color: var(--green); font-size: 9px; letter-spacing: .18em; text-transform: uppercase; }
    .story-watch-subtitle { margin: 16px 0 20px; color: rgba(34,35,31,.65); font: 400 21px/1.25 var(--serif); }
    .story-watch-copy .body-copy { margin: 0 0 24px; }
    .story-watch-price { margin: 0 0 25px; font-size: 10px; letter-spacing: .11em; }
    .story-watch-specs { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: clamp(28px, 4vw, 58px); border-top: 1px solid var(--line); }
    .story-watch-spec { min-width: 0; padding: 19px 18px 4px 0; }
    .story-watch-spec + .story-watch-spec { padding-left: 20px; border-left: 1px solid var(--line); }
    .story-watch-spec span { display: block; margin-bottom: 8px; color: var(--green); font-size: 8px; letter-spacing: .16em; text-transform: uppercase; }
    .story-watch-spec strong { font: 400 17px/1.35 var(--serif); }

    .manifesto {
      display: grid; min-height: 540px; place-items: center; padding: 90px var(--gutter);
      background: var(--green); color: var(--ivory); text-align: center;
    }
    .story-hero { position: relative; isolation: isolate; overflow: hidden; background: var(--charcoal); }
    .story-hero > img { position: absolute; z-index: 0; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 54%; }
    .story-hero::after {
      position: absolute; z-index: 1; inset: 0;
      background: linear-gradient(90deg, rgba(22,25,22,.82), rgba(22,25,22,.6) 55%, rgba(22,25,22,.36)),
        linear-gradient(0deg, rgba(22,25,22,.36), rgba(22,25,22,.12));
      content: "";
    }
    .story-hero > div { position: relative; z-index: 2; }
    .manifesto h2 { max-width: 1050px; margin: 0; font: 400 clamp(55px, 9vw, 124px)/.88 var(--serif); letter-spacing: -.055em; }
    .manifesto .eyebrow { color: #d4c8b3; }
    .editorial-section {
      display: grid; grid-template-columns: .86fr 1.14fr; gap: clamp(40px, 9vw, 140px);
      align-items: center; padding: clamp(90px, 12vw, 170px) var(--gutter);
    }
    .editorial-section:nth-child(even) { grid-template-columns: 1.14fr .86fr; }
    .editorial-section:nth-child(even) .editorial-image { order: 2; }
    .editorial-image { position: relative; overflow: hidden; min-height: 450px; aspect-ratio: .95; background: var(--paper); }
    .editorial-image img { position: absolute; inset: 0; height: 100%; object-fit: cover; }
    .editorial-copy h2 { margin: 0 0 23px; font: 400 clamp(44px, 5.5vw, 76px)/.91 var(--serif); letter-spacing: -.05em; }
    .editorial-copy .body-copy { margin: 0 0 24px; }
    .editorial-copy .eyebrow { margin-bottom: 20px; }
    .milestone-band { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--paper); }
    .milestone { padding: 52px clamp(22px, 4vw, 60px); border-right: 1px solid var(--line); }
    .milestone:last-child { border-right: 0; }
    .milestone strong { display: block; margin-bottom: 10px; color: var(--green); font: 400 clamp(38px, 5vw, 66px)/1 var(--serif); }

    function currentPage() {
      const path = location.hash.replace(/^#\/?/, "");

    function bindPageInteractions() {
      const form = document.getElementById("inquiry-form");
      if (form) {
        const selectedWatch = new URLSearchParams(location.hash.split("?")[1] || "").get("watch");
        const interest = document.getElementById("interest");
        if (selectedWatch && interest) {
          const watch = watchCollection.find((item) => item.id === selectedWatch);
          if (watch) interest.value = watch.name;
        }
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          if (!form.reportValidity()) return;
          const data = new FormData(form);
          const subject = `AUREVÉ inquiry from ${data.get("firstName")} ${data.get("lastName")}`;
          const body = [
            `Name: ${data.get("firstName")} ${data.get("lastName")}`,
            `Email: ${data.get("email")}`,
            `Interest: ${data.get("interest") || "Not specified"}`,
            "",
            String(data.get("message"))
          ].join("\n");
          const status = document.getElementById("form-status");
          status.textContent = "Your email application is opening with your inquiry. We look forward to speaking with you.";
          window.location.href = `mailto:concierge@aureve.ch?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        });
      }
      document.querySelectorAll("[data-gallery-image]").forEach((button) => {
        button.addEventListener("click", () => {
          const mainImage = document.querySelector(".gallery-main img");
          if (!mainImage) return;
          document.querySelectorAll("[data-gallery-image]").forEach((item) => item.setAttribute("aria-pressed", "false"));
          button.setAttribute("aria-pressed", "true");
          mainImage.style.opacity = "0";
          window.setTimeout(() => {
            mainImage.src = button.dataset.galleryImage;
            mainImage.alt = button.dataset.galleryAlt;
            mainImage.style.opacity = "1";
          }, 160);
        });
      });
    }

    function renderPage(animate = false) {
      const page = currentPage();
      if (animate && activeRoute !== page.key + location.hash) {
        main.classList.add("is-leaving");
        window.setTimeout(() => {
          main.innerHTML = page.content;
          main.classList.remove("is-leaving");
          finishRender(page);
        }, 170);
      } else {
        main.innerHTML = page.content;
        finishRender(page);
      }
      activeRoute = page.key + location.hash;
    }

    function finishRender(page) {
      document.title = page.title;
      header.classList.toggle("is-solid", page.key !== "home");
      nav.querySelectorAll("a").forEach((link) => {
        const target = link.getAttribute("href").slice(1);
        const active = target === page.key || (target === "collection" && page.key === "watch");
        if (active) link.setAttribute("aria-current", "page");
        else link.removeAttribute("aria-current");
      });
      footer.innerHTML = footerMarkup();
      bindPageInteractions();
      observeReveals();
      window.scrollTo({ top: 0, behavior: "instant" });
      closeMenu();
    }

    let revealObserver;
    function observeReveals() {
      if (revealObserver) revealObserver.disconnect();
      const targets = document.querySelectorAll("[data-reveal]");
      if (!("IntersectionObserver" in window) || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        targets.forEach((element) => element.classList.add("is-visible"));
        return;
      }
      revealObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: .12, rootMargin: "0px 0px -35px 0px" });
      targets.forEach((element) => revealObserver.observe(element));
    }

    function closeMenu() {
      nav.classList.remove("is-open");
      menuToggle.setAttribute("aria-expanded", "false");
      menuToggle.setAttribute("aria-label", "Open navigation");
      document.body.classList.remove("menu-open");
    }
    menuToggle.addEventListener("click", () => {
      const isOpen = menuToggle.getAttribute("aria-expanded") === "true";
      menuToggle.setAttribute("aria-expanded", String(!isOpen));
      menuToggle.setAttribute("aria-label", isOpen ? "Open navigation" : "Close navigation");
      nav.classList.toggle("is-open", !isOpen);
      document.body.classList.toggle("menu-open", !isOpen);
      if (!isOpen && window.matchMedia("(max-width: 680px)").matches) {
        nav.querySelector("a").focus();
      }
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && menuToggle.getAttribute("aria-expanded") === "true") {
        closeMenu();
        menuToggle.focus();
      }
    });
    nav.addEventListener("click", (event) => {
      if (event.target.closest("a")) closeMenu();
      else if (menuToggle.getAttribute("aria-expanded") === "true") closeMenu();
    });
    window.addEventListener("hashchange", () => renderPage(true));
    renderPage();
  </script>
</body>
</html>
